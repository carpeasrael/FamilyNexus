name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze project source
        run: flutter analyze

      # On Linux, sqflite_common_ffi loads the system SQLCipher (pubspec.yaml → hooks).
      - name: Install SQLCipher
        run: sudo apt-get update && sudo apt-get install -y libsqlcipher-dev

      # End-to-end tests (FN_E2E) need Docker/Synapse and are skipped here.
      - name: Run tests
        run: flutter test

  android:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # vodozemac (cryptography) is built from source via Rust during the Android build.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug --target-platform android-arm64

  linux:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libsqlcipher-dev
          rustup toolchain install stable --profile minimal

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux debug bundle
        run: flutter build linux --debug
