name: Release

# Builds a signed release APK, a signed Android App Bundle (AAB, for Google Play), a Linux Flatpak bundle, a Windows
# zip (exe + DLLs), a notarized macOS DMG and the web app (zip, also published on GitHub Pages) for every pushed version
# tag (v*) and attaches them, with SHA-256 files, to the GitHub release. The App Store packages (iOS IPA, macOS pkg)
# are kept as workflow artifacts for the upload with Transporter.
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64   upload keystore, base64-encoded (base64 -i upload-keystore.jks)
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias (e.g. upload)
#   ANDROID_KEY_PASSWORD      key password
#   APPLE_API_KEY_BASE64      App Store Connect API key (.p8), base64-encoded; role Admin (cloud-managed signing)
#   APPLE_API_KEY_ID          its key ID
#   APPLE_API_ISSUER_ID       issuer ID (App Store Connect -> Users and Access -> Integrations)
# Without the Apple secrets the apple job only builds an unsigned DMG (workflow artifact, for testing).
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach the files to (e.g. v1.0.1)
        required: true
      build:
        description: What to build; "aab" keeps an existing APK asset untouched, "flatpak" builds only the Linux bundle, "windows" only the Windows zip, "web" only the web app, "apple" only DMG and App Store packages
        type: choice
        options: [apk+aab, aab, flatpak, windows, web, apple]
        default: apk+aab
      ref:
        description: 'Only for "flatpak", "windows", "web" and "apple" - branch or commit to build instead of the tag (the file is still attached to the tag release)'
        required: false

permissions:
  contents: write

jobs:
  apk:
    if: >-
      github.event.inputs.build != 'flatpak' && github.event.inputs.build != 'windows' && github.event.inputs.build != 'web'
      && github.event.inputs.build != 'apple'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      BUILD: ${{ github.event.inputs.build || 'apk+aab' }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}

      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE STORE_PW ALIAS KEY_PW; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret for $v (see header of release.yml)"; exit 1; fi
          done

      - name: Check tag matches pubspec version
        run: |
          name=$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' pubspec.yaml)
          if [ "v$name" != "$TAG" ]; then echo "::error::Tag $TAG does not match pubspec version $name"; exit 1; fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # vodozemac (cryptography) is built from source via Rust during the Android build.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$STORE_PW"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEY_PW"
          } > android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      # Separate symbol directories: each build writes its own obfuscation symbols.
      - name: Build signed release APK
        if: env.BUILD == 'apk+aab'
        run: |
          mkdir -p debug-info/apk
          flutter build apk --release --obfuscate --split-debug-info=debug-info/apk \
            --target-platform android-arm,android-arm64

      - name: Verify APK signature
        if: env.BUILD == 'apk+aab'
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose build/app/outputs/flutter-apk/app-release.apk | head -5

      # The App Bundle contains all ABIs (arm, arm64, x86_64); Google Play delivers the matching one per device.
      - name: Build signed release App Bundle
        run: |
          mkdir -p debug-info/aab
          flutter build appbundle --release --obfuscate --split-debug-info=debug-info/aab

      - name: Verify AAB signature
        run: |
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab | head -2
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep -E "Owner|SHA256"

      - name: Prepare release files
        run: |
          mkdir -p dist
          if [ "$BUILD" = "apk+aab" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk "dist/FamilyNexus-${TAG}.apk"
          fi
          cp build/app/outputs/bundle/release/app-release.aab "dist/FamilyNexus-${TAG}.aab"
          cd dist
          for f in "FamilyNexus-${TAG}.apk" "FamilyNexus-${TAG}.aab"; do
            if [ -f "$f" ]; then sha256sum "$f" > "$f.sha256"; fi
          done

      # Obfuscation symbols are needed to read stack traces; keep them private (not a release asset).
      - uses: actions/upload-artifact@v7
        with:
          name: debug-info-${{ env.TAG }}-run${{ github.run_number }}
          path: debug-info/
          retention-days: 90

      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "FamilyNexus ${TAG#v}" --generate-notes --verify-tag
          fi
          gh release upload "$TAG" dist/* --clobber

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks" android/key.properties

  # Linux: Flatpak bundle (tool/build_flatpak.sh, manifest flatpak/de.inneso.familynexus.yml). Runs after the Android
  # job so that only one job creates the GitHub release.
  flatpak:
    needs: apk
    if: >-
      always() && (needs.apk.result == 'success' || needs.apk.result == 'skipped')
      && github.event.inputs.build != 'aab' && github.event.inputs.build != 'windows' && github.event.inputs.build != 'web'
      && github.event.inputs.build != 'apple'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ (github.event.inputs.ref != '' && github.event.inputs.build == 'flatpak') && github.event.inputs.ref || env.TAG }}

      - name: Check tag matches pubspec version
        run: |
          name=$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' pubspec.yaml)
          if [ "v$name" != "$TAG" ]; then echo "::error::Tag $TAG does not match pubspec version $name"; exit 1; fi

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Build Flatpak bundle
        run: tool/build_flatpak.sh

      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "FamilyNexus ${TAG#v}" --generate-notes --verify-tag
          fi
          gh release upload "$TAG" "build/flatpak/FamilyNexus-${TAG}.flatpak" "build/flatpak/FamilyNexus-${TAG}.flatpak.sha256" --clobber

  # Windows: zip with familynexus.exe, Flutter runtime, SQLCipher (built from source with vcpkg, E-52) and the VC++
  # runtime DLLs. Runs after the Android job so that only one job creates the GitHub release.
  windows:
    needs: apk
    if: >-
      always() && (needs.apk.result == 'success' || needs.apk.result == 'skipped')
      && github.event.inputs.build != 'aab' && github.event.inputs.build != 'flatpak' && github.event.inputs.build != 'web'
      && github.event.inputs.build != 'apple'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ (github.event.inputs.ref != '' && github.event.inputs.build == 'windows') && github.event.inputs.ref || env.TAG }}

      - name: Check tag matches pubspec version
        run: |
          name=$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' pubspec.yaml)
          if [ "v$name" != "$TAG" ]; then echo "::error::Tag $TAG does not match pubspec version $name"; exit 1; fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      # SQLCipher from source (OpenSSL backend); no prebuilt database binary is downloaded.
      - name: Build SQLCipher
        run: vcpkg install sqlcipher:x64-windows

      # Only the two DLLs SQLCipher needs go into the app (vcpkg also installs a plain sqlite3.dll, Tcl and more). The
      # load test runs against exactly this set, so a missing dependency fails the build instead of the user's start.
      - name: Check SQLCipher library
        run: |
          bin="$VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin"
          ls -l "$bin"
          mkdir -p sqlcipher-dlls
          cp "$bin/sqlcipher.dll" "$bin/libcrypto-3-x64.dll" sqlcipher-dlls/
          python - sqlcipher-dlls <<'PY'
          import ctypes, os, sys
          d = os.path.abspath(sys.argv[1])
          os.add_dll_directory(d)
          lib = ctypes.CDLL(os.path.join(d, "sqlcipher.dll"))
          lib.sqlite3_libversion.restype = ctypes.c_char_p
          lib.sqlite3_key
          print("SQLite", lib.sqlite3_libversion().decode(), "with codec (sqlite3_key present)")
          PY

      - name: Build Windows app
        run: |
          flutter pub get
          mkdir -p debug-info
          flutter build windows --release --obfuscate --split-debug-info=debug-info

      - name: Assemble zip
        run: |
          out="build/windows/x64/runner/Release"
          cp sqlcipher-dlls/*.dll "$out/"
          for f in msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do cp "/c/Windows/System32/$f" "$out/"; done
          ls -l "$out"
          mkdir -p dist
          name="FamilyNexus-${TAG}-windows-x64.zip"
          powershell -NoProfile -Command "Compress-Archive -Path '$out/*' -DestinationPath 'dist/$name' -Force"
          (cd dist && sha256sum "$name" > "$name.sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: debug-info-windows-${{ env.TAG }}-run${{ github.run_number }}
          path: debug-info/
          retention-days: 90

      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "FamilyNexus ${TAG#v}" --generate-notes --verify-tag
          fi
          gh release upload "$TAG" dist/* --clobber

  # macOS and iOS (tool/build_macos_dmg.sh, tool/build_macos_release.sh, tool/build_ios_release.sh): Developer-ID DMG,
  # notarized and attached to the release; App Store packages as private workflow artifacts. Signing is cloud-managed
  # through the App Store Connect API key, so no certificate or profile is stored as a secret.
  apple:
    needs: apk
    if: >-
      always() && (needs.apk.result == 'success' || needs.apk.result == 'skipped')
      && github.event.inputs.build != 'aab' && github.event.inputs.build != 'flatpak' && github.event.inputs.build != 'windows'
      && github.event.inputs.build != 'web'
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ (github.event.inputs.ref != '' && github.event.inputs.build == 'apple') && github.event.inputs.ref || env.TAG }}

      - name: Check tag matches pubspec version
        run: |
          name=$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' pubspec.yaml)
          if [ "v$name" != "$TAG" ]; then echo "::error::Tag $TAG does not match pubspec version $name"; exit 1; fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      # vodozemac (cryptography) is built from source via Rust during the iOS and macOS builds.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-ios aarch64-apple-darwin x86_64-apple-darwin

      - name: Restore App Store Connect API key
        id: key
        env:
          KEY: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::Apple secrets missing (see header of release.yml): building an unsigned DMG only"
            echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          umask 077
          printf '%s' "$KEY" | base64 -d > "$RUNNER_TEMP/asc_key.p8"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          flutter pub get
          flutter gen-l10n

      # Each build writes its own obfuscation symbols; they are moved aside so the next build does not mix them.
      - name: Build DMG (Developer ID, notarized)
        if: steps.key.outputs.signed == 'true'
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/asc_key.p8
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          tool/build_macos_dmg.sh
          mkdir -p symbols && mv debug-info symbols/macos-dmg

      - name: Build unsigned DMG (test only)
        if: steps.key.outputs.signed != 'true'
        run: |
          tool/build_macos_dmg.sh --unsigned
          mkdir -p symbols && mv debug-info symbols/macos-dmg

      - name: Build Mac App Store package
        if: steps.key.outputs.signed == 'true'
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/asc_key.p8
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          tool/build_macos_release.sh
          mv debug-info symbols/macos-store

      - name: Build iOS App Store package
        if: steps.key.outputs.signed == 'true'
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/asc_key.p8
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          tool/build_ios_release.sh
          mv debug-info symbols/ios

      - name: Collect App Store packages
        if: steps.key.outputs.signed == 'true'
        run: |
          mkdir -p store
          cp build/ios/ipa/*.ipa "store/FamilyNexus-${TAG}-ios.ipa"
          cp build/macos/export/FamilyNexus.pkg "store/FamilyNexus-${TAG}-macos-appstore.pkg"
          (cd store && for f in *; do shasum -a 256 "$f" > "$f.sha256"; done)

      - uses: actions/upload-artifact@v7
        if: steps.key.outputs.signed == 'true'
        with:
          name: appstore-${{ env.TAG }}-run${{ github.run_number }}
          path: store/
          retention-days: 90

      - uses: actions/upload-artifact@v7
        if: steps.key.outputs.signed != 'true'
        with:
          name: macos-unsigned-${{ env.TAG }}-run${{ github.run_number }}
          path: build/macos/dmg/
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: debug-info-apple-${{ env.TAG }}-run${{ github.run_number }}
          path: symbols/
          retention-days: 90

      - name: Attach to GitHub release
        if: steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "FamilyNexus ${TAG#v}" --generate-notes --verify-tag
          fi
          gh release upload "$TAG" build/macos/dmg/* --clobber

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc_key.p8"

  # Web: build with WebAssembly parts (SQLite3MultipleCiphers from a pinned release, vodozemac built from source),
  # test in headless Chrome, attach a zip to the release and hand the files to the Pages deployment below (E-53).
  web:
    needs: apk
    if: >-
      always() && (needs.apk.result == 'success' || needs.apk.result == 'skipped')
      && github.event.inputs.build != 'aab' && github.event.inputs.build != 'flatpak' && github.event.inputs.build != 'windows'
      && github.event.inputs.build != 'apple'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ (github.event.inputs.ref != '' && github.event.inputs.build == 'web') && github.event.inputs.ref || env.TAG }}

      - name: Check tag matches pubspec version
        run: |
          name=$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' pubspec.yaml)
          if [ "v$name" != "$TAG" ]; then echo "::error::Tag $TAG does not match pubspec version $name"; exit 1; fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      # vodozemac for the browser: Rust nightly (build-std), wasm-pack, wasm-bindgen and the code generator are pinned.
      - name: Rust toolchain for WebAssembly
        run: rustup toolchain install nightly-2026-10-22 --profile minimal -c rust-src -t wasm32-unknown-unknown

      - name: Cache Rust tools
        id: tools
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: web-tools-frb2.13.0-wasm-bindgen0.2.100-wasm-pack0.15.0-${{ runner.os }}

      - name: Install Rust tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked
          cargo install wasm-bindgen-cli --version 0.2.100 --locked
          cargo install wasm-pack --version 0.15.0 --locked

      - name: Build web app
        run: |
          flutter pub get
          WASM_RUSTUP_TOOLCHAIN=nightly-2026-10-22 tool/web_assets.sh
          tool/web_matrix_patch.sh
          tool/build_web.sh

      - name: Self-test (database, vault, vodozemac) in headless Chrome
        run: tool/web_selftest.sh

      - name: Smoke test (start, vault, unlock) in headless Chrome
        run: python3 tool/web_smoke.py google-chrome

      # Base path /: host the zip at the root of a domain (for another path edit <base href> in index.html).
      - name: Zip for self-hosting
        run: |
          mkdir -p dist
          name="FamilyNexus-${TAG}-web.zip"
          (cd build/web_app && zip -qr "../../dist/$name" .)
          (cd dist && sha256sum "$name" > "$name.sha256")

      - name: Build for GitHub Pages
        run: BASE_HREF=/FamilyNexus/ tool/build_web.sh

      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "FamilyNexus ${TAG#v}" --generate-notes --verify-tag
          fi
          gh release upload "$TAG" dist/* --clobber

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web_app

  web-deploy:
    needs: web
    # always(): `web` hängt hinter dem übersprungenen Android-Job; ohne dies würde auch dieser Job übersprungen.
    if: always() && needs.web.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
