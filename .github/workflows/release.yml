name: Release

# Builds a signed release APK, a signed Android App Bundle (AAB, for Google Play) and a Linux Flatpak bundle for every
# pushed version tag (v*) and attaches them, with SHA-256 files, to the GitHub release.
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64   upload keystore, base64-encoded (base64 -i upload-keystore.jks)
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias (e.g. upload)
#   ANDROID_KEY_PASSWORD      key password
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach the files to (e.g. v1.0.1)
        required: true
      build:
        description: What to build; "aab" keeps an existing APK asset untouched, "flatpak" builds only the Linux bundle
        type: choice
        options: [apk+aab, aab, flatpak]
        default: apk+aab
      ref:
        description: 'Only for "flatpak" - branch or commit to build instead of the tag (the file is still attached to the tag release)'
        required: false

permissions:
  contents: write

jobs:
  apk:
    if: github.event.inputs.build != 'flatpak'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      BUILD: ${{ github.event.inputs.build || 'apk+aab' }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}

      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE STORE_PW ALIAS KEY_PW; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret for $v (see header of release.yml)"; exit 1; fi
          done

      - name: Check tag matches pubspec version
        run: |
          name=$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' pubspec.yaml)
          if [ "v$name" != "$TAG" ]; then echo "::error::Tag $TAG does not match pubspec version $name"; exit 1; fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # vodozemac (cryptography) is built from source via Rust during the Android build.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$STORE_PW"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEY_PW"
          } > android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      # Separate symbol directories: each build writes its own obfuscation symbols.
      - name: Build signed release APK
        if: env.BUILD == 'apk+aab'
        run: |
          mkdir -p debug-info/apk
          flutter build apk --release --obfuscate --split-debug-info=debug-info/apk \
            --target-platform android-arm,android-arm64

      - name: Verify APK signature
        if: env.BUILD == 'apk+aab'
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose build/app/outputs/flutter-apk/app-release.apk | head -5

      # The App Bundle contains all ABIs (arm, arm64, x86_64); Google Play delivers the matching one per device.
      - name: Build signed release App Bundle
        run: |
          mkdir -p debug-info/aab
          flutter build appbundle --release --obfuscate --split-debug-info=debug-info/aab

      - name: Verify AAB signature
        run: |
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab | head -2
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep -E "Owner|SHA256"

      - name: Prepare release files
        run: |
          mkdir -p dist
          if [ "$BUILD" = "apk+aab" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk "dist/FamilyNexus-${TAG}.apk"
          fi
          cp build/app/outputs/bundle/release/app-release.aab "dist/FamilyNexus-${TAG}.aab"
          cd dist
          for f in "FamilyNexus-${TAG}.apk" "FamilyNexus-${TAG}.aab"; do
            if [ -f "$f" ]; then sha256sum "$f" > "$f.sha256"; fi
          done

      # Obfuscation symbols are needed to read stack traces; keep them private (not a release asset).
      - uses: actions/upload-artifact@v7
        with:
          name: debug-info-${{ env.TAG }}-run${{ github.run_number }}
          path: debug-info/
          retention-days: 90

      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "FamilyNexus ${TAG#v}" --generate-notes --verify-tag
          fi
          gh release upload "$TAG" dist/* --clobber

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks" android/key.properties

  # Linux: Flatpak bundle (tool/build_flatpak.sh, manifest flatpak/de.inneso.familynexus.yml). Runs after the Android
  # job so that only one job creates the GitHub release.
  flatpak:
    needs: apk
    if: >-
      always() && (needs.apk.result == 'success' || needs.apk.result == 'skipped')
      && github.event.inputs.build != 'aab'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ (github.event.inputs.ref != '' && github.event.inputs.build == 'flatpak') && github.event.inputs.ref || env.TAG }}

      - name: Check tag matches pubspec version
        run: |
          name=$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' pubspec.yaml)
          if [ "v$name" != "$TAG" ]; then echo "::error::Tag $TAG does not match pubspec version $name"; exit 1; fi

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Build Flatpak bundle
        run: tool/build_flatpak.sh

      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "FamilyNexus ${TAG#v}" --generate-notes --verify-tag
          fi
          gh release upload "$TAG" "build/flatpak/FamilyNexus-${TAG}.flatpak" "build/flatpak/FamilyNexus-${TAG}.flatpak.sha256" --clobber
