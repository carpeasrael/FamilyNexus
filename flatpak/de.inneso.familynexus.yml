# Flatpak-Manifest (E-50). Der Bau braucht Netzzugriff (pub, crates, Flutter-Engine) und ist deshalb nicht
# Flathub-konform; Verteilung als Bundle über GitHub-Releases (tool/build_flatpak.sh).
app-id: de.inneso.familynexus
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: familynexus
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  - --talk-name=org.freedesktop.Notifications
  # Kein --talk-name=com.canonical.Unity: Die Zahl am Starter-Symbol (#254) ist ein Broadcast-Signal, das der
  # D-Bus-Proxy auch ohne Freigabe durchlässt (gemessen 03.11.2026, E-88).
  # Kein --talk-name=org.freedesktop.secrets: libsecret legt die Schlüssel in der Sandbox über das
  # Secret-Portal ab (data/keyrings); die Freigabe gäbe Zugriff auf den ganzen Schlüsselbund des Nutzers (F-03).
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
modules:
  # SQLCipher aus dem Quellcode: eigener Dateiname (libsqlcipher.so), verdrängt nicht das libsqlite3 der Laufzeit.
  # -Bsymbolic: GTK lädt das System-libsqlite3 vorher; ohne dies würden interne Aufrufe dorthin umgebogen (Absturz).
  - name: sqlcipher
    buildsystem: simple
    build-commands:
      - >-
        ./configure --prefix=/app --with-tempstore=yes --disable-readline --dll-basename=libsqlcipher
        CFLAGS="-O2 -DSQLITE_HAS_CODEC -DSQLITE_EXTRA_INIT=sqlcipher_extra_init -DSQLITE_EXTRA_SHUTDOWN=sqlcipher_extra_shutdown"
        LDFLAGS="-lcrypto -Wl,-Bsymbolic"
      - make -j"$FLATPAK_BUILDER_N_JOBS" libsqlcipher.so
      - readelf -d libsqlcipher.so | grep -E 'NEEDED|SONAME'
      - readelf -d libsqlcipher.so | grep -q 'libcrypto'
      - install -Dm755 libsqlcipher.so /app/lib/libsqlcipher.so
    sources:
      - type: archive
        url: https://github.com/sqlcipher/sqlcipher/archive/refs/tags/v4.19.0.tar.gz
        sha256: 7075f96cbabe45b4ecfc2e6b1745a625f856f695b0827a5506ce9ed85b906aa0

  - name: familynexus
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - flatpak/build-app.sh
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - .dart_tool
          - build
          - coverage
          - debug-info
          - android
          - ios
          - macos
          - integration_test
          - test
          - test_driver
          - store
          - docs
      - type: archive
        url: https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.7-stable.tar.xz
        sha256: af7455f540df951184c7953fbe3cf884766e7541dacf8571f9f582db03dd6230
        dest: .flutter-sdk
        strip-components: 1
      - type: file
        # Feste Version (archive/<Version>), nicht dist/: dist/ zeigt immer auf die neueste Datei, und die Prüfsumme brach beim Release v1.2.2.
        url: https://static.rust-lang.org/rustup/archive/1.29.3/x86_64-unknown-linux-gnu/rustup-init
        sha256: b1c8cb14e30889e7e2999e6b69e62d9e9b9ffc0f4df8180564d306d9680e6c55
